name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - run: dotnet build

      # The workflow-command logger turns each test outcome into a check annotation, so a failure
      # is readable from the API without downloading the run log.
      - run: dotnet test --no-build --logger "console;format=workflow-command" --results-directory TestResults --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
