name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # format-pr.yml dispatches this after pushing a formatting commit.
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale runs for the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-and-test:
    # Required status check on main; keep this name in sync with the ruleset.
    name: Build & test
    # Ubuntu can cross-build the win-x64 app, so no Windows runner is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - run: dotnet format Tagium.slnx --verify-no-changes

      # Restores and builds the whole solution, then runs the unit tests.
      - run: dotnet test Tagium.slnx
