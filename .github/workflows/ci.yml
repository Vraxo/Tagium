name: CI

# Only run once per change: pull_request covers branch pushes for branches with an
# open PR (testing the merge ref against main), and push covers main after merges.
# Pushes to branches without a PR intentionally run nothing — open a PR to get CI.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs: all runs for the same PR share one group, so a new push
# to a PR branch cancels its queued/stale runs instead of wasting runner time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build-and-test:
    name: Build app & run tests
    # ubuntu is the fastest runner image; the win-x64 desktop app still cross-compiles here,
    # so no Windows runner is needed just to verify the build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK with NuGet cache
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Tagium.slnx

      # Builds the whole solution once (Tagium.Core, Tagium.Core.Tests and the
      # win-x64 Photino app), so the test step below can skip restore and build.
      - name: Build solution
        run: dotnet build Tagium.slnx --no-restore

      - name: Run unit tests
        run: dotnet test Tagium.Core.Tests/Tagium.Core.Tests.csproj --no-restore --no-build --logger trx --results-directory ./TestResults

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7
