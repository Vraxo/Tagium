name: CI

# Run for PRs targeting main and pushes to main; branch pushes without a PR are ignored.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale runs for the same PR or ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build-and-test:
    name: Build & test
    # Ubuntu can cross-build the win-x64 app; no Windows runner is needed for CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK with NuGet cache
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Tagium.slnx

      - name: Verify formatting
        run: dotnet format Tagium.slnx --verify-no-changes --no-restore

      # Build once so the test step can skip restore and build.
      - name: Build solution
        run: dotnet build Tagium.slnx --no-restore

      - name: Run unit tests
        run: dotnet test Tagium.Core.Tests/Tagium.Core.Tests.csproj --no-restore --no-build --logger trx --results-directory ./TestResults

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7
