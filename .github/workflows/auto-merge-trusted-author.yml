name: Auto-merge trusted author PRs

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: ${{ github.event.pull_request.user.login == 'Vraxo' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # This workflow intentionally does not check out or execute code from the PR.
      - name: Enable native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          auto_merge_state="$(gh api graphql \
            -F pullRequestId="$PR_NODE_ID" \
            -f query='query($pullRequestId: ID!) { node(id: $pullRequestId) { ... on PullRequest { state isDraft autoMergeRequest { enabledAt } } } }' \
            --jq '.data.node | if .state == "OPEN" and (.isDraft | not) and .autoMergeRequest == null then "enable" else "skip" end')"

          if [[ "$auto_merge_state" != "enable" ]]; then
            echo "PR is closed, draft, or already has auto-merge enabled; nothing to do."
            exit 0
          fi

          gh api graphql \
            -F pullRequestId="$PR_NODE_ID" \
            -f query='mutation($pullRequestId: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: MERGE }) { pullRequest { number autoMergeRequest { enabledAt } } } }'
