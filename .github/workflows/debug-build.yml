name: Debug Build (temporary)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  debug:
    name: Debug build errors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Tagium.slnx

      - name: Build solution
        run: |
          set -o pipefail
          dotnet build Tagium.slnx --no-restore 2>&1 | tee /tmp/build.log

      - name: Comment build errors on the PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Build errors on \`${{ github.event.pull_request.head.sha }}\`"
            echo '```'
            grep -iE "error" /tmp/build.log | grep -viE "0 error|error\(s\)" | sort -u | head -60
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md || true
