<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tagium</title>
    <base href="/" />
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <!-- Required for Blazor CSS Isolation (MainLayout.razor.css, etc.) -->
    <link href="Tagium.styles.css" rel="stylesheet" />
    <link href="css/macos.css" rel="stylesheet" />
    <link href="css/windows11.css" rel="stylesheet" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #app {
            height: 100%;
        }

        /* .drag-over::after styles live in css/app.css so every theme token applies. */

        /* Utility class used by layout.js during drag */
        .no-select {
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        window.themeManager = {
            applyTheme: function (colors) {
                document.documentElement.removeAttribute('style');
                if (colors) {
                    for (const [key, value] of Object.entries(colors)) {
                        if (['--radius-sm', '--radius-md', '--radius-lg'].includes(key)) {
                            continue;
                        }
                        document.documentElement.style.setProperty(key, value);
                    }
                }
                const accent = document.documentElement.dataset.windowsAccent;
                if (accent && document.documentElement.dataset.interfaceStyle === 'windows11') {
                    this.applyWindowsAccentColor(accent);
                }
            },
            applyWindowsAccentColor: function (color) {
                const root = document.documentElement;
                if (root.dataset.interfaceStyle !== 'windows11'
                    || !/^#[0-9a-f]{6}$/i.test(color || '')) {
                    return;
                }

                root.dataset.windowsAccent = color;
                root.style.setProperty('--windows-accent-color', color);
                root.style.setProperty('--primary-color', color);
                root.style.setProperty('--primary-hover', `color-mix(in srgb, ${color} 82%, black)`);
                root.style.setProperty('--primary-tint', `color-mix(in srgb, ${color} 22%, transparent)`);

                const red = parseInt(color.slice(1, 3), 16) / 255;
                const green = parseInt(color.slice(3, 5), 16) / 255;
                const blue = parseInt(color.slice(5, 7), 16) / 255;
                const linear = value => value <= 0.04045
                    ? value / 12.92
                    : Math.pow((value + 0.055) / 1.055, 2.4);
                const luminance = 0.2126 * linear(red) + 0.7152 * linear(green) + 0.0722 * linear(blue);
                root.style.setProperty('--text-on-primary', luminance > 0.179 ? '#121212' : '#ffffff');
            },
            applyMacOSAppearance: function (enabled) {
                document.documentElement.dataset.interfaceStyle = enabled ? 'macos' : 'classic';
            },
            applyInterfaceStyle: function (style) {
                const styles = { Classic: 'classic', MacOS: 'macos', Windows11: 'windows11' };
                document.documentElement.dataset.interfaceStyle = styles[style] || 'classic';
                if (document.documentElement.dataset.interfaceStyle === 'windows11') {
                    const accent = document.documentElement.dataset.windowsAccent;
                    if (accent) {
                        this.applyWindowsAccentColor(accent);
                    }
                } else {
                    delete document.documentElement.dataset.windowsAccent;
                }
            },
            applyNativeMica: function (enabled) {
                document.documentElement.dataset.nativeMica = enabled ? 'true' : 'false';
            },
            applyNativeAcrylic: function (enabled) {
                if (enabled) {
                    document.documentElement.dataset.nativeAcrylic = 'true';
                } else {
                    delete document.documentElement.dataset.nativeAcrylic;
                }
            },
            getPopupAnchor: function (element) {
                if (!element) {
                    return null;
                }

                const rect = element.getBoundingClientRect();
                return {
                    left: rect.left,
                    top: rect.top,
                    right: rect.right,
                    bottom: rect.bottom,
                    scale: window.devicePixelRatio || 1
                };
            },
            applyCornerStyle: function (style) {
                const styles = ['sharp', 'subtle', 'default', 'rounded'];
                const normalized = String(style || 'Default').toLowerCase();
                document.documentElement.dataset.cornerStyle = styles.includes(normalized)
                    ? normalized
                    : 'default';
            }
        };
    </script>
    <script src="js/dragdrop.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/libraryNav.js"></script>
    <script>window.libraryNav.init();</script>
    <script src="js/contextMenu.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/modalFocus.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/tagiumNavigation.js"></script>
    <script src="js/tagGraphVendors.js"></script>
    <script src="js/tagGraph.js"></script>
    <script src="js/videoVolume.js"></script>
    <script src="js/zoom.js"></script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
